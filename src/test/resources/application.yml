spring:
  r2dbc:
    # -${random.uuid} : configuring this parameter, we're using a DB distinct by context (by each test class)
    url: r2dbc:h2:mem:///studentDB-${random.uuid}
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

api:
  version: /api/v1

resource:
  students: /students
  users: /users
  roles: /roles